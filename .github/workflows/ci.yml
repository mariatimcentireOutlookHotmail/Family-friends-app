# Runs on every push and pull request. If any step fails, GitHub shows a red ✗
# on the commit and emails you.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Translation check (missing keys, broken plural syntax)
        run: npm run i18n:check

      - name: Web build (catches config and bundling errors)
        run: npx expo export --platform web --output-dir dist
