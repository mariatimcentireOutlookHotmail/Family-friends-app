# Runs on every push and pull request. If any step fails, GitHub shows a red ✗
# on the commit and emails you.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      # All checks live in package.json ("ci" script), so this file doesn't
      # need to change when checks are added: typecheck, lint, translations,
      # privacy-rule tests and a web build.
      - name: Check, test and build
        run: npm run ci
